; Scroll Ring MIDI Thing
;
; Needs an ESP32-S3: it is the only common ESP32 with both Bluetooth LE (to
; talk to the ring) and native USB OTG (to be a class-compliant USB MIDI device).
;
; Uses the pioarduino platform (Arduino-ESP32 3.x), which ships the
; USBMIDI class and a NimBLE-enabled Bluetooth stack.

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; 'deep' so the framework's LittleFS/USB libraries find their FS dependency
lib_ldf_mode = deep
; 3MB app + LittleFS, fits any 4MB+ module (no OTA needed)
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = web/index.html
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Generic ESP32-S3 DevKitC-1 (or any S3 board with two USB ports).
; Flash and serial logs over the "UART"/"COM" port; plug the "USB"/"OTG"
; port into the computer to get the MIDI device.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; Override the board's -DARDUINO_USB_MODE=1 so the native USB port runs
; TinyUSB (needed for USB MIDI) instead of the hardware serial/JTAG bridge.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; S3 boards that only have the native USB port (e.g. Seeed XIAO ESP32S3,
; many "mini" boards). The device enumerates as MIDI + a CDC serial port so
; logs and re-flashing still work over the one cable. If an upload ever
; fails, hold BOOT while tapping RESET to force the bootloader.
[env:esp32s3-single-usb]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Host-side unit tests for the matching / learning engine:
;   pio test -e native
[env:native]
platform = native
framework =
board_build.embed_txtfiles =
lib_deps =
build_flags = -std=gnu++17 -Isrc
build_src_filter = -<*> +<pattern.cpp> +<engine.cpp>
test_build_src = yes
